services:
  symfony_zoo_app:
    image: symfony_zoo_image
    build:
     context: .
     dockerfile: Dockerfile
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/
    environment:
      MAILER_DSN: smtp://mailhog:1025

  mysql:
    image: mysql:8.4
    environment:
       MYSQL_ROOT_PASSWORD: root_password
       MYSQL_DATABASE: symfony_zoo_db
       MYSQL_USER: symfo
       MYSQL_PASSWORD: nbvcxw
    ports:
      - "3307:3306"
    volumes:
      - data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8082:80" 

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  # Service Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"  # Port par défaut de Grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=nbvcxw  # Définissez un mot de passe administrateur
    volumes:
      - grafana_data:/var/lib/grafana
 

volumes:
  data:
  grafana_data:
