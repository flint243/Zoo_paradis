server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: symfony_logs
          __path__: /var/lib/docker/containers/8bb20c578e8caffe6e6fd0029c9e2d0167ade88753467f82eff52cddbd310b25/8bb20c578e8caffe6e6fd0029c9e2d0167ade88753467f82eff52cddbd310b25-json.log",
