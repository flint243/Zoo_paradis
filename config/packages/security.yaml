security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            host: ^(localhost|127\.0\.0\.1|dev\.example\.com)$
            security: false
        main:
            login_throttling:
                max_attempts: 5
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                enable_csrf: true
            logout:
                path: app_logout

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_SUPER_ADMIN, ROLE_EMPLOYE, ROLE_VETERINAIRE]
        ROLE_EMPLOYE: [ROLE_EMPLOYE]
        ROLE_VETERINAIRE: [ROLE_VETERINAIRE]

    access_control:
    - { path: ^/login$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/super/admin, roles: ROLE_SUPER_ADMIN }
    - { path: ^/employe, roles: ROLE_EMPLOYE }
    - { path: ^/veterinaire, roles: ROLE_VETERINAIRE }
   